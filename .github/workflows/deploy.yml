name: Deploy site to Cloudflare Pages

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      rebuild_unkernel:
        description: Force rebuilding the unkernel images (bypass image cache)
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Clone repo
        with:
          submodules: 'recursive'

      - name: Read unkernel submodule revision
        id: meta
        run: |
          echo "unkernel_sha=$(git -C unkernel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        name: Setup Node.js
        with:
          node-version: '24'

      - uses: mlugg/setup-zig@v2
        name: Setup Zig
        with:
          version: 0.16.0

      - name: Ensure host tools
        run: |
          if ! command -v zstd >/dev/null || ! command -v patch >/dev/null || ! command -v unzip >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends zstd patch unzip
          fi

      - name: Cache unkernel toolchain and downloads
        uses: actions/cache@v6
        with:
          path: |
            unkernel/vendor/downloads
            unkernel/vendor/toolchain/erofs-utils
            build/unkernel-base
          key: unkernel-tools-${{ runner.os }}-${{ steps.meta.outputs.unkernel_sha }}-zig-0.16.0
          restore-keys: |
            unkernel-tools-${{ runner.os }}-${{ steps.meta.outputs.unkernel_sha }}-

      - name: Restore built unkernel images
        id: image-cache
        if: ${{ !inputs.rebuild_unkernel }}
        uses: actions/cache/restore@v6
        with:
          path: |
            build/unkernel-distro
            build/unkernel-home
            public/unkernel
            src/*.erofs.json
          key: unkernel-images-${{ runner.os }}-${{ steps.meta.outputs.unkernel_sha }}-${{ hashFiles('scripts/**', 'Makefile', 'README.org') }}

      - name: Build and chunk unkernel images
        if: ${{ steps.image-cache.outputs.cache-hit != 'true' }}
        run: make all

      - name: Save built unkernel images
        if: ${{ !inputs.rebuild_unkernel && steps.image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/unkernel-distro
            build/unkernel-home
            public/unkernel
            src/*.erofs.json
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: Verify outputs
        run: |
          ls -lh public/unkernel/
          if find public/unkernel -type f -size +25M | grep -q .; then
            echo "::error::Found file(s) exceeding Cloudflare Pages 25 MiB limit"
            exit 1
          fi
          for f in src/alpine.erofs.json src/spacemacs.erofs.json src/doom.erofs.json src/readme.erofs.json; do
            echo "=== $f ==="
            cat "$f"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Build site
        run: pnpm build

      - name: Verify dist file sizes
        run: |
          if find dist -type f -size 25M | grep -q .; then
            echo "::error::Found file(s) in dist/ exceeding Cloudflare Pages 25 MiB limit"
            exit 1
          fi

      - uses: cloudflare/wrangler-action@v3
        name: Deploy pages
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.52.1"
