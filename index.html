<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emacs Playground</title>
    <style>
@import "https://cdn.jsdelivr.net/gh/mshaugh/nerdfont-webfonts@v3.3.0/build/firacode-nerd-font.css";

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

#app {
  width: 100%;
  height: 100vh;
  background-color: #262626;
  color: #b2b2b2;
}

#head {
  height: 2em;
  padding: 0 4px;
  overflow: auto hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-wrap: nowrap;
  gap: 1em;
}
#head > * {
  display: flex;
  align-items: center;
  gap: 4px;
}
#head a {
  color: #b2b2b2;
}
a.logo {
  text-decoration: none;
}
.logo img {
  height: 1.6em;
  margin-right: 4px;
}

#term {
  padding: 0 4px;
  height: calc(100% - 2em - 8px);
}

#explorer {
  display: none;
  position: absolute;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  overflow: auto;
  background-color: #262626;
  color: #b2b2b2;
  opacity: 0.9;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#explorer > * {
  margin: 1em;
}
#explorer a {
  color: #92b2b2;
}
    </style>
  </head>
  <body>
    <noscript>This site requires JavaScript to work.</noscript>
    <div id="app">
      <header id="head">
        <a class="logo" href="https://doc.emacsen.de/" target="_blank">
          <img class="logo" src="/favicon.svg" alt="Emacs logo">
          Emacs Docs
        </a>
        <div>
          <div id="progress"></div>
          <div><span id="fs" title="filesystem">.</span></div>
          <select id="variant">
            <option value="norm">Emacs</option>
            <option value="orgm">Org Mode</option>
            <option value="mini"><code>emacs -Q</code></option>
            <option value="doom">Doom Emacs</option>
            <option value="spac">Spacemacs</option>
          </select>
          <label>
            <input type="checkbox" id="ctrl">
            <code>Ctrl</code>
          </label>
          <button id="question">?</button>
          <button id="paste">📋</button>
          <button id="open">📁</button>
        </div>
        <div>
          <a href="https://github.com/gudzpoz/emacs.v86.js">GitHub Repo</a>
        </div>
      </header>
      <div id="term"></div>
    </div>
    <div id="explorer">
      <div>
        <button id="upload">📤</button>
        <label>Path: <input id="path" type="text"></label>
        <button id="go">Go</button>
        <button id="exit">Quit</button>
      </div>
      <ul id="entries"></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
