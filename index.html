<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emacs Playground</title>
    <style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

#app {
  width: 100%;
  height: 100vh;
  background-color: #262626;
  color: #b2b2b2;
}

#head {
  height: 2em;
  padding: 0 4px;
  overflow: auto hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-wrap: nowrap;
  gap: 1em;
}
#head > * {
  display: flex;
  align-items: center;
  gap: 4px;
}
#head a {
  color: #b2b2b2;
}
a.logo {
  text-decoration: none;
}
.logo img {
  height: 1.6em;
  margin-right: 4px;
}

#term {
  padding: 0 4px;
  height: calc(100% - 2em - 8px);
}
    </style>
  </head>
  <body>
    <div id="app">
      <header id="head">
        <a class="logo" href="https://doc.emacsen.de/" target="_blank">
          <img class="logo" src="/favicon.svg" alt="Emacs logo">
          Emacs Docs
        </a>
        <div>
          <div id="progress"></div>
          <select id="variant">
            <option value="norm">Emacs</option>
            <option value="orgm">Org Mode</option>
            <option value="mini"><code>emacs -Q</code></option>
            <option value="full">Spacemacs</option>
          </select>
          <label>
            <input type="checkbox" id="ctrl">
            <code>Ctrl</code>
          </label>
          <button id="question">?</button>
          <button id="paste">📋</button>
        </div>
        <div>
          <a href="https://github.com/copy/v86" target="_blank">
            Powered by v86
          </a>
        </div>
      </header>
      <div id="term"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
